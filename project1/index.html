<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Dashboard | Hana Mahmoud</title>
</head>
<body>
  <div class="menu"  >
    <ul>
          <li class="profile">
             <div class="img-box">
                <img src="img7.jpeg" alt="profile">
             </div>
                  <h2>Hana</h2>
                 </li>
            <li>
             <a class="active" href="#">
                <i class="fas fa-home"></i>
                <p>dashboard</p>
                 </a>
            </li>
                 <li>
             <a href="#">
                <i class="fas fa-user-group"></i>
                <p>clients</p>
                 </a>
            </li> 
                  <li>
             <a href="#">
                <i class="fas fa-table"></i>
                <p>products</p>
                 </a>
            </li> 
                  <li>
             <a href="#">
                <i class="fas fa-chart-pie"></i>
                <p>charts</p>
                 </a>
            </li> 
                  <li>
             <a href="#">
                <i class="fas fa-pen"></i>
                <p>posts</p>
                 </a>
            </li> 
                   <li>
             <a href="#">
                <i class="fas fa-star"></i>
                <p>favorite</p>
                 </a>
            </li> 
                   <li>
             <a href="#">
                <i class="fas fa-cog"></i>
                <p>settings</p>
                 </a>
            </li> 
                    <li class="log-out">
             <a href="#">
                <i class="fas fa-sign-out"></i>
                <p>Log Out</p>
                 </a>
            </li> 
     
    </ul>

  </div>

<div class="content" id="content">
<div class="title-info">
     <p>dashboard</p>
     <i class="fas fa-chart-bar"></i>
</div>
<div class="data-info">
<div class="box">
<i class="fas fa-user"></i>
<div class="data">
<p>user</p>
<span>200</span>
</div>
</div>
      <div class="box">
<i class="fas fa-pen"></i>
<div class="data">
<p>posts</p>
<span>420</span>
</div>
      </div>

       <div class="box">
<i class="fas fa-table"></i>
<div class="data">
<p>products</p>
<span>5000</span>
</div>
       </div>
        <div class="box">
<i class="fas fa-dollar"></i>
<div class="data">
<p>revenue</p>
<span>$244</span>

</div>

</div>
<div class="title-info">
<p>products</p>
<i class="fas fa-chart-table"></i>



</div>

<table>
    <thead>
       <tr>
           <th>products</th>
           <th>price</th>
           <th>count</th>
       </tr>

    </thead>
<tbody>
     <tr>
         <td>tv</td>
         <td><span class="price">$666</span></td>
          <td><span class="count">422</span></td>
        
     </tr>
<tr>
         <td>laptop</td>
         <td><span class="price">$233</span></td>
          <td><span class="count">980</span></td>
        
     </tr>

   <tr>
         <td>headphones</td>
         <td><span class="price">$69</span></td>
          <td><span class="count">42</span></td>
        
     </tr>

     <tr>
         <td>phone</td>
         <td><span class="price">$533</span></td>
          <td><span class="count">2888</span></td>
        
     </tr>

     <tr>
         <td>keyboard</td>
         <td><span class="price">$56</span></td>
          <td><span class="count">277</span></td>
        
     </tr>


</tbody>



</table>


<script src="script.js"></script>

</body>
</html>
